root = "."
tmp_dir = "tmp"
env_files = [".env"]

[build]
  cmd = "go build -o ./tmp/main.exe ./cmd/server"
  entrypoint = ["./tmp/main.exe"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "vendor", ".git"]
  exclude_regex = ["_test.go"]
  delay = 300
  stop_on_error = true
  log = "build-errors.log"

  [build.windows]
    cmd = "go build -o ./tmp/main.exe ./cmd/server"
    entrypoint = ["tmp\\main.exe"]

[log]
  time = true

[misc]
  clean_on_exit = true
